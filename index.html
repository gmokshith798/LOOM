<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    try { localStorage.removeItem('portal_theme'); } catch(e) {}
    // Instant session bridge: guarantee active_user and edu_app_session_v2 exist in localStorage
    try {
      var sUser = localStorage.getItem('edu_app_session_v2') || 
                  localStorage.getItem('active_user') || 
                  sessionStorage.getItem('edu_app_session_v2') || 
                  localStorage.getItem('edu_app_session_v1') || 
                  sessionStorage.getItem('edu_app_session_v1');
      if (sUser) {
        localStorage.setItem('edu_app_session_v2', sUser);
        localStorage.setItem('active_user', sUser);
      }
    } catch(e) {}
  </script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Loom - JEE Portal</title>
  <meta name="description" content="Loom Portal - Assignments, Notes, Homework, Doubt Chat" />
  <meta name="theme-color" content="#0b1322" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Loom" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   Educational Assignment Management App - Core Design System
   Modern HSL Palette, Glassmorphism, Responsive Mobile Frame & Components
   ========================================================================== */

:root {
  /* Color Palette - Deep Slate & Modern Indigo/Violet Accents */
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-card: rgba(30, 41, 59, 0.75);
  --bg-glass: rgba(15, 23, 42, 0.65);
  
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  
  --brand-primary: #6366f1; /* Indigo */
  --brand-primary-hover: #4f46e5;
  --brand-secondary: #8b5cf6; /* Violet */
  --brand-accent: #06b6d4; /* Cyan */

  --role-chairman: #8b5cf6;
  --role-teacher: #3b82f6;
  --role-student: #10b981;

  --status-active-bg: rgba(16, 185, 129, 0.15);
  --status-active-text: #34d399;
  --status-inactive-bg: rgba(244, 63, 94, 0.15);
  --status-inactive-text: #fb7185;

  --border-light: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(99, 102, 241, 0.3);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.25);

  --font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 60%);
  background-attachment: scroll;
}

@media (min-width: 769px) {
  body {
    background-attachment: fixed;
  }
}

/* Base Container & Viewport Switcher */
.app-container {
  width: 100%;
  max-width: 1200px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Mobile Simulator Shell Mode */
.app-container.mobile-mode {
  max-width: 420px;
  height: 840px;
  max-height: 92vh;
  margin: 15px auto;
  border-radius: 40px;
  border: 10px solid #1e293b;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), var(--shadow-glow);
  overflow: hidden !important;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Top Switcher Bar */
.top-bar-controls {
  position: sticky;
  top: 0;
  width: 100%;
  padding: 12px 20px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  flex-shrink: 0;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.5px;
  color: var(--text-main);
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

.mode-toggle-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-light);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.mode-toggle-btn:hover {
  background: rgba(99, 102, 241, 0.2);
  color: #fff;
  border-color: var(--brand-primary);
}

/* Main Viewport Content - Smooth Vertical Scroll */
.main-content {
  flex: 1 1 auto;
  padding: 20px;
  padding-bottom: 120px !important;
  overflow-y: auto !important;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}

.app-container.mobile-mode .main-content {
  height: calc(100% - 58px);
  max-height: calc(100% - 58px);
}

/* Sleek Scrollbar */
.main-content::-webkit-scrollbar,
.data-table-container::-webkit-scrollbar,
.tabs-nav::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.main-content::-webkit-scrollbar-track,
.data-table-container::-webkit-scrollbar-track,
.tabs-nav::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.4);
  border-radius: 4px;
}

.main-content::-webkit-scrollbar-thumb,
.data-table-container::-webkit-scrollbar-thumb,
.tabs-nav::-webkit-scrollbar-thumb {
  background: rgba(99, 102, 241, 0.4);
  border-radius: 4px;
}

.main-content::-webkit-scrollbar-thumb:hover,
.data-table-container::-webkit-scrollbar-thumb:hover,
.tabs-nav::-webkit-scrollbar-thumb:hover {
  background: var(--brand-primary);
}

/* Cards & Panels */
.glass-card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  margin-bottom: 20px;
}

.glass-card:hover {
  border-color: rgba(99, 102, 241, 0.25);
}

/* Typography & Headings */
h1, h2, h3, h4 {
  color: var(--text-main);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.section-title {
  font-size: 1.4rem;
  margin-bottom: 6px;
}

.section-subtitle {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
  color: white;
  box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  border: 1px solid var(--border-light);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.2);
}

.btn-danger {
  background: rgba(244, 63, 94, 0.15);
  color: #fb7185;
  border: 1px solid rgba(244, 63, 94, 0.3);
}

.btn-danger:hover {
  background: rgba(244, 63, 94, 0.3);
  color: white;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

.btn-full {
  width: 100%;
}

/* Form Inputs */
.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.form-control {
  width: 100%;
  padding: 12px 16px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.92rem;
  outline: none;
  transition: all 0.2s ease;
}

.form-control:focus {
  border-color: var(--brand-primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  background: rgba(15, 23, 42, 0.85);
}

/* Dropzone Upload */
.file-dropzone {
  border: 2px dashed rgba(99, 102, 241, 0.4);
  background: rgba(99, 102, 241, 0.05);
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.file-dropzone:hover, .file-dropzone.drag-over {
  border-color: var(--brand-primary);
  background: rgba(99, 102, 241, 0.12);
}

.file-dropzone-icon {
  font-size: 2rem;
  color: var(--brand-primary);
  margin-bottom: 8px;
}

/* Status Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: capitalize;
}

.badge-active {
  background: var(--status-active-bg);
  color: var(--status-active-text);
  border: 1px solid rgba(52, 211, 153, 0.2);
}

.badge-inactive {
  background: var(--status-inactive-bg);
  color: var(--status-inactive-text);
  border: 1px solid rgba(251, 113, 133, 0.2);
}

.badge-chairman {
  background: rgba(139, 92, 246, 0.18);
  color: #c084fc;
}

.badge-teacher {
  background: rgba(59, 130, 246, 0.18);
  color: #60a5fa;
}

.badge-student {
  background: rgba(16, 185, 129, 0.18);
  color: #34d399;
}

/* Navigation Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
}

.user-profile-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: white;
  font-size: 1rem;
}

/* Stats Metric Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(99, 102, 241, 0.15);
  color: var(--brand-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}

.stat-val {
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.1;
}

.stat-lbl {
  font-size: 0.78rem;
  color: var(--text-muted);
}

/* Tables & Lists */
.data-table-container {
  width: 100%;
  overflow-x: auto;
  overflow-y: visible;
  max-width: 100%;
  margin-bottom: 20px;
  touch-action: pan-x pan-y;
  -webkit-overflow-scrolling: touch;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.88rem;
}

.data-table th {
  padding: 12px 16px;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 1px solid var(--border-light);
  background: rgba(15, 23, 42, 0.4);
}

.data-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-main);
  vertical-align: middle;
}

.data-table tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}

/* Tabs */
.tabs-nav {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 20px;
  padding-bottom: 6px;
  overflow-x: auto;
  flex-wrap: nowrap;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 16px;
  cursor: pointer;
  position: relative;
  transition: color 0.2s ease;
  white-space: nowrap;
  flex-shrink: 0;
}

.tab-btn.active {
  color: var(--brand-primary);
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
  border-radius: 3px 3px 0 0;
}

/* ===== Chairman Sidebar Menu ===== */
.chairman-menu-bar, .student-menu-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-light);
}

.chairman-menu-btn, .student-menu-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(139,92,246,0.18));
  border: 1px solid rgba(99,102,241,0.35);
  border-radius: 12px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 700;
  padding: 10px 18px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.3px;
}

.chairman-menu-btn:hover, .student-menu-btn:hover {
  background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.3));
  border-color: rgba(99,102,241,0.6);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(99,102,241,0.25);
}

.chairman-menu-btn .hamburger-icon, .student-menu-btn .hamburger-icon {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 18px;
}

.chairman-menu-btn .hamburger-icon span, .student-menu-btn .hamburger-icon span {
  display: block;
  height: 2px;
  background: var(--brand-primary);
  border-radius: 2px;
  transition: all 0.2s ease;
}

.chairman-active-tab-label, .student-active-tab-label {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--brand-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Sidebar Overlay */
.chairman-sidebar-overlay, .student-sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(3px);
  z-index: 900;
  animation: fadeInOverlay 0.2s ease;
}

.chairman-sidebar-overlay.open, .student-sidebar-overlay.open {
  display: block;
}

@keyframes fadeInOverlay {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Sidebar Drawer */
.chairman-sidebar-drawer, .student-sidebar-drawer {
  position: fixed;
  top: 0;
  left: 0;
  transform: translateX(-100%);
  width: 300px;
  height: 100vh;
  background: linear-gradient(180deg, #0f172a 0%, #1a1f35 100%);
  border-right: 1px solid var(--border-light);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
  overflow: hidden;
}

.chairman-sidebar-drawer.open, .student-sidebar-drawer.open {
  transform: translateX(0);
  box-shadow: 8px 0 40px rgba(0,0,0,0.5);
}

.chairman-sidebar-header, .student-sidebar-header {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(99,102,241,0.08);
}

.chairman-sidebar-header .sidebar-title, .student-sidebar-header .sidebar-title {
  font-size: 1rem;
  font-weight: 800;
  background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
}

.chairman-sidebar-close, .student-sidebar-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border-light);
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.chairman-sidebar-close:hover, .student-sidebar-close:hover {
  background: rgba(239,68,68,0.15);
  border-color: #ef4444;
  color: #ef4444;
}

.chairman-sidebar-body, .student-sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
  scrollbar-width: none;
}

.chairman-sidebar-body::-webkit-scrollbar, .student-sidebar-body::-webkit-scrollbar { display: none; }

.chairman-sidebar-section-label, .student-sidebar-section-label {
  padding: 8px 20px 4px;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.chairman-nav-item, .student-nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 20px;
  cursor: pointer;
  transition: all 0.15s ease;
  border-left: 3px solid transparent;
  margin: 1px 0;
  position: relative;
}

.chairman-nav-item:hover, .student-nav-item:hover {
  background: rgba(99,102,241,0.08);
  border-left-color: rgba(99,102,241,0.4);
}

.chairman-nav-item.active, .student-nav-item.active {
  background: rgba(99,102,241,0.15);
  border-left-color: var(--brand-primary);
}

.chairman-nav-icon, .student-nav-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(99,102,241,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
  transition: background 0.15s;
}

.chairman-nav-item.active .chairman-nav-icon, .student-nav-item.active .student-nav-icon {
  background: rgba(99,102,241,0.25);
}

.chairman-nav-text, .student-nav-text {
  flex: 1;
}

.chairman-nav-title, .student-nav-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.2;
}

.chairman-nav-item.active .chairman-nav-title, .student-nav-item.active .student-nav-title {
  color: var(--brand-primary);
}

.chairman-nav-desc, .student-nav-desc {
  font-size: 0.72rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.chairman-nav-arrow, .student-nav-arrow {
  font-size: 0.75rem;
  color: var(--text-dim);
  transition: transform 0.15s;
}

.chairman-nav-item.active .chairman-nav-arrow, .student-nav-item.active .student-nav-arrow {
  color: var(--brand-primary);
  transform: translateX(2px);
}

/* Modal Popup System */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;

const DB_NAME = "InterJEEStore";
const DB_VERSION = 1;
const STORE_NAME = "data";

const idbOpen = () => {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
};

const idbGet = async (key) => {
  const db = await idbOpen();
  return new Promise((resolve) => {
    const transaction = db.transaction(STORE_NAME, "readonly");
    const request = transaction.objectStore(STORE_NAME).get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => resolve(null);
  });
};

const idbSet = async (key, val) => {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(STORE_NAME, "readwrite");
    const request = transaction.objectStore(STORE_NAME).put(val, key);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
};

class Store {
  constructor() {
    this.STORAGE_KEY = "inter_jee_app_data_v25_clean";
    this.inMemoryStore = null;
    this.initStore();
  }

  initStore() {
    // 1. Temporarily load SEED_DATA so synchronous UI doesn't crash on boot
    this.inMemoryStore = JSON.parse(JSON.stringify(SEED_DATA));
    
    // 2. Asynchronously load the REAL data from IndexedDB
    idbGet(this.STORAGE_KEY).then(data => {
      if (data) {
        this.inMemoryStore = data;
      } else {
        // If IDB is empty, migrate from localStorage (one-time)
        try {
          const existing = localStorage.getItem(this.STORAGE_KEY);
          if (existing) {
            this.inMemoryStore = JSON.parse(existing);
          }
        } catch (e) {}
      }

      // Automatic data recovery from all legacy storage keys
      const oldKeys = [
        "inter_jee_app_data_live_stable_v20",
        "inter_jee_app_data_v25_clean",
        "inter_jee_app_data_live_stable",
        "inter_jee_app_data"
      ];
      
      let recoveredAny = false;
      oldKeys.forEach(k => {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const parsed = JSON.parse(raw);
            ['assignments', 'notes', 'homeworks', 'syllabuses', 'chatMessages', 'submissions'].forEach(key => {
              if (Array.isArray(parsed[key]) && parsed[key].length > 0) {
                if (!this.inMemoryStore[key]) this.inMemoryStore[key] = [];
                const existingMap = new Map(this.inMemoryStore[key].map(item => [item.id, item]));
                parsed[key].forEach(item => {
                  if (item && item.id && !existingMap.has(item.id)) {
                    this.inMemoryStore[key].push(item);
                    recoveredAny = true;
                  }
                });
              }
            });
          }
        } catch(e) {}
      });

      if (recoveredAny) {
        this.saveStore(this.inMemoryStore);
      } else {
        idbSet(this.STORAGE_KEY, this.inMemoryStore).catch(()=>{});
      }

      // CRITICAL: Ensure admin -> chairman normalization in loaded store
      if (this.inMemoryStore && Array.isArray(this.inMemoryStore.users)) {
        let hasChairman = false;
        this.inMemoryStore.users.forEach(u => {
          if (u.id === 'usr_admin' || u.role === 'admin' || (u.username && u.username.toLowerCase() === 'admin') || (u.username && u.username.toLowerCase() === 'chairman')) {
            u.role = 'chairman';
            u.status = 'active';
            hasChairman = true;
          }
        });
        if (!hasChairman) {
          this.inMemoryStore.users.unshift(JSON.parse(JSON.stringify(SEED_DATA.users[0])));
        }
        // Ensure notes, homeworks, syllabuses, assignments are wiped clean as requested
        this.inMemoryStore.notes = [];
        this.inMemoryStore.homeworks = [];
        this.inMemoryStore.syllabuses = [];
        this.inMemoryStore.assignments = [];
        this.inMemoryStore.submissions = [];
        this.saveStore(this.inMemoryStore);
      }
      
      // 3. Trigger a re-render now that the real data is loaded
      if (window.appAuth && window.appAuth.getCurrentUser()) {
        const user = window.appAuth.getCurrentUser();
        if (user && (user.role === 'admin' || user.id === 'usr_admin')) {
          user.role = 'chairman';
        }
        if (window.app && typeof window.app.handleRoute === 'function') {
          window.app.handleRoute();
        } else if (window.UI) {
          if (user.role === 'chairman' || user.role === 'admin') window.UI.renderChairmanPage('users');
          else if (user.role === 'teacher') window.UI.renderTeacherPage('assignments');
          else window.UI.renderStudentPage('assignments');
        }
      }
    }).catch(err => {
      console.warn("IDB init failed", err);
    });
  }

  getStore() {
    let store = this.inMemoryStore;
    if (!store) {
      try {
        const raw = localStorage.getItem(this.STORAGE_KEY);
        store = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED_DATA));
      } catch (e) {
        console.warn("Failed to parse store, rebuilding from seed", e);
        store = JSON.parse(JSON.stringify(SEED_DATA));
      }
      this.inMemoryStore = store;
    }

    if (!store.users || !Array.isArray(store.users)) store.users = JSON.parse(JSON.stringify(SEED_DATA.users));
    if (!store.assignments) store.assignments = [];
    if (!store.notes) store.notes = [];
    if (!store.syllabuses) store.syllabuses = [];
    if (!store.homeworks) store.homeworks = [];
    if (!store.chatMessages || !Array.isArray(store.chatMessages)) store.chatMessages = [];
    if (!store.submissions || !Array.isArray(store.submissions)) store.submissions = [];

    // Always normalize admin to chairman
    let hasChairman = false;
    store.users.forEach(u => {
      if (u.id === 'usr_admin' || u.role === 'admin' || (u.username && u.username.toLowerCase() === 'admin') || (u.username && u.username.toLowerCase() === 'chairman')) {
        u.role = 'chairman';
        u.status = 'active';
        hasChairman = true;
      }
    });
    if (!hasChairman) {
      store.users.unshift(JSON.parse(JSON.stringify(SEED_DATA.users[0])));
    }
    if (!store.notes) store.notes = [];
    if (!store.homeworks) store.homeworks = [];
    if (!store.syllabuses) store.syllabuses = [];

    return store;
  }

  // Internal write — always updates both memory and localStorage
  _writeStore(data) {
    this.inMemoryStore = data;
    // Async save to IndexedDB to bypass the 5MB localStorage limit
    idbSet(this.STORAGE_KEY, data).catch(e => {
      console.warn("IndexedDB write failed, kept in memory", e);
      // Fallback to localStorage just in case IndexedDB is totally broken
      try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data)); } catch(err){}
    });
  }

  // Internal write for incoming CloudSync data - avoids re-pushing back to Firebase
  _writeStoreFromCloud(data) {
    this.inMemoryStore = data;
    idbSet(this.STORAGE_KEY, data).catch(e => {
      try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data)); } catch(err){}
    });
  }

  saveStore(data) {
    this._writeStore(data);
  }

  // Stub kept for compatibility — no-op, cloud removed
  async syncWithCloud() { return; }
  pushToCloud(data) { return; }

  resetToDefaults() {
    this.saveStore(SEED_DATA);
    return SEED_DATA;
  }

  // --- USER MANAGEMENT ---
  getUsers() {
    return this.getStore().users || [];
  }

  getUserByUsername(username) {
    if (!username) return null;
    const clean = username.trim().toLowerCase();
    const users = this.getUsers();
    
    // Direct match
    let found = users.find(u => (u.username || '').toLowerCase() === clean);
    if (found) return found;

    // Universal Chairman alias: allow 'chairman' or 'admin' to find the director/chairman account
    if (clean === 'chairman' || clean === 'admin') {
      return users.find(u => 
        (u.username && u.username.toLowerCase() === 'chairman') ||
        (u.username && u.username.toLowerCase() === 'admin') ||
        u.role === 'chairman' ||
        u.role === 'admin' ||
        u.id === 'usr_admin'
      );
    }
    return null;
  }

  getUserById(id) {
    if (!id) return null;
    const users = this.getUsers();
    let found = users.find(u => u.id === id);
    if (!found && (id === 'usr_admin' || id === 'admin' || id === 'chairman')) {
      return users.find(u => u.role === 'chairman' || u.role === 'admin' || u.id === 'usr_admin');
    }
    return found;
  }

  getManagement() {
    // Returns executive leadership: CEO, MD, Co-Chairman, Principal, Management
    return this.getUsers().filter(u => ['ceo', 'md', 'co-chairman', 'principal', 'management'].includes((u.role || '').toLowerCase()));
  }

  getTeachers() {
    // Returns faculty/teachers only (Management now in their own tab)
    return this.getUsers().filter(u => (u.role || '').toLowerCase() === 'teacher');
  }

  getStudents() {
    return this.getUsers().filter(u => u.role === "student");
  }

  addUser(userData) {
    const store = this.getStore();
    const existing = store.users.find(
      u => u.username.toLowerCase() === userData.username.trim().toLowerCase()
    );
    if (existing) {
      throw new Error(`Username '${userData.username}' is already registered in Inter-JEE system.`);
    }

    const newUser = {
      id: `usr_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
      username: userData.username.trim(),
      password: userData.password || "pass123",
      name: userData.name.trim(),
      role: userData.role,
      phone: userData.phone || "+91 94933 49113",
      department: userData.department || (userData.role === "teacher" ? "JEE Science & Math Dept" : undefined),
      gradeClass: userData.gradeClass || (userData.role === "student" ? "12th MPC Super-60 (JEE 2026)" : undefined),
      status: "active",
      createdAt: new Date().toISOString()
    };

    store.users.push(newUser);
    this.saveStore(store);
    return newUser;
  }

  updateUser(userId, updatedFields) {
    const store = this.getStore();
    const user = store.users.find(u => u.id === userId);
    if (!user) throw new Error("User account not found");

    if (updatedFields.username && updatedFields.username.trim().toLowerCase() !== user.username.toLowerCase()) {
      const existing = store.users.find(
        u => u.id !== userId && u.username.toLowerCase() === updatedFields.username.trim().toLowerCase()
      );
      if (existing) {
        throw new Error(`Username '${updatedFields.username}' is already taken by another account.`);
      }
      user.username = updatedFields.username.trim();
    }

    if (updatedFields.name) user.name = updatedFields.name.trim();
    if (updatedFields.password) user.password = updatedFields.password;
    if (updatedFields.phone) user.phone = updatedFields.phone.trim();
    if (updatedFields.department !== undefined) user.department = updatedFields.department.trim();
    if (updatedFields.gradeClass !== undefined) user.gradeClass = updatedFields.gradeClass.trim();
    if (updatedFields.status) user.status = updatedFields.status;

    if (user.role === "teacher" && updatedFields.name) {
      store.assignments.forEach(a => {
        if (a.teacherId === userId) a.teacherName = user.name;
      });
      (store.notes || []).forEach(n => {
        if (n.teacherId === userId) n.teacherName = user.name;
      });
      (store.homeworks || []).forEach(h => {
        if (h.teacherId === userId) h.teacherName = user.name;
      });
    }

    this.saveStore(store);
    return user;
  }

  toggleUserStatus(userId) {
    const store = this.getStore();
    const user = store.users.find(u => u.id === userId);
    if (!user) throw new Error("User not found");
    if (user.role === "chairman") throw new Error("Cannot deactivate Chairman account");

    user.status = user.status === "active" ? "inactive" : "active";
    this.saveStore(store);
    return user;
  }

  canDeleteUser(userId) {
    const store = this.getStore();
    const user = store.users.find(u => u.id === userId);
    if (!user) return { canDelete: false, reason: "User not found" };
    if (user.role === "chairman" || user.id === "usr_admin") {
      return { canDelete: false, reason: "Cannot delete the Chairman Director account." };
    }
    return { canDelete: true };
  }

  updateUserSubscription(userId, expiryDate) {
    const store = this.getStore();
    const idx = store.users.findIndex(u => u.id === userId);
    if (idx !== -1) {
      store.users[idx].subscriptionExpiry = expiryDate;
      this.saveStore(store);
      return true;
    }
    return false;
  }

  deleteUserDirectly(userId) {
    const store = this.getStore();
    const idx = store.users.findIndex(u => u.id === userId);
    if (idx !== -1) {
      if (store.users[idx].role === "chairman" || store.users[idx].id === "usr_admin") {
        throw new Error("Cannot delete the Chairman Director account.");
      }
      const deleted = store.users.splice(idx, 1)[0];
      // Clean up any student submissions
      if (store.submissions) {
        store.submissions = store.submissions.filter(s => s.studentId !== userId);
      }
      this.saveStore(store);
      if (typeof CloudSync !== 'undefined' && typeof CloudSync.pushKey === 'function') {
        CloudSync.pushKey('users', store.users);
      }
      return true;
    }
    return false;
  }

  // --- CHAT & DOUBT SOLVING MODULE ---
  getChatMessages(targetId, currentUserId) {
    const msgs = this.getStore().chatMessages || [];
    const PUBLIC_CHANNELS = ["general_announcements", "phy_doubts", "chem_doubts", "maths_doubts"];

    if (PUBLIC_CHANNELS.includes(targetId)) {
      return msgs.filter(m => m && (m.channelId === targetId || (!m.channelId && !m.recipientId && targetId === "general_announcements")));
    } else {
      const currentUser = this.getUserById(currentUserId);
      const targetUser = this.getUserById(targetId);
      
      const currentIds = new Set([currentUserId]);
      if (currentUser) {
        currentIds.add(currentUser.id);
        if (currentUser.username) currentIds.add(currentUser.username);
      }
      
      const targetIds = new Set([targetId]);
      if (targetUser) {
        targetIds.add(targetUser.id);
        if (targetUser.username) targetIds.add(targetUser.username);
      }

      return msgs.filter(m => 
        m && (
          (currentIds.has(m.senderId) && targetIds.has(m.recipientId)) ||
          (targetIds.has(m.senderId) && currentIds.has(m.recipientId))
        )
      );
    }

  sendChatMessage(msgData) {
    if (!msgData.text && !msgData.attachmentContent) {
      throw new Error("Message text or file attachment is required.");
    }

    const store = this.getStore();
    if (!store.chatMessages || !Array.isArray(store.chatMessages)) {
      store.chatMessages = [...SEED_DATA.chatMessages];
    }

    const newMsg = {
      id: `msg_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
      channelId: msgData.recipientId ? null : (msgData.channelId || "general_announcements"),
      recipientId: msgData.recipientId || null,
      senderId: msgData.senderId,
      senderName: msgData.senderName,

    const store = this.getStore();

    (store.chatMessages || []).forEach(m => {
      if (m.senderId === senderId && m.recipientId === currentUserId) {
        if (!m.readBy) m.readBy = [m.senderId];
        if (!m.readBy.includes(currentUserId)) {
          m.readBy.push(currentUserId);
          updated = true;
        }
      }
    });
    if (updated) this.saveStore(store);

    const idx = (store.chatMessages || []).findIndex(m => m.id === msgId);

/**
 * Educational Assignment Management App - Auth Module
 * Handles Login, Logout, Session persistence, and Role Guarding
 */

class Auth {
  constructor() {
    this.SESSION_KEY = "edu_app_session_v2";
    this.currentUser = this.loadSession();
  }

  loadSession() {
    if (this.inMemoryUser) return this.inMemoryUser;
    try {
      const raw = localStorage.getItem(this.SESSION_KEY) || 
                  localStorage.getItem("active_user") ||
                  sessionStorage.getItem(this.SESSION_KEY) || 
                  localStorage.getItem("edu_app_session_v1") ||
                  sessionStorage.getItem("edu_app_session_v1");
      if (!raw) return null;
      const user = JSON.parse(raw);
      if (user && user.id) {
        this.inMemoryUser = user;
        this.currentUser = user;
        return user;
      }
      return null;
    } catch (e) {
      console.warn("Session storage read warning:", e);
      return null;
    }
  }

  saveSession(user) {
    this.currentUser = user;
    this.inMemoryUser = user;
    try {
      const serialized = JSON.stringify(user);
      localStorage.setItem(this.SESSION_KEY, serialized);
      localStorage.setItem("active_user", serialized);
      sessionStorage.setItem(this.SESSION_KEY, serialized);
    } catch (e) {
      console.warn("Session storage save warning:", e);
    }
  }

  clearSession() {
    this.currentUser = null;
    this.inMemoryUser = null;
    try {
      localStorage.removeItem(this.SESSION_KEY);
      localStorage.removeItem("active_user");
      localStorage.removeItem("edu_app_session_v1");
      sessionStorage.removeItem(this.SESSION_KEY);
      sessionStorage.removeItem("edu_app_session_v1");
    } catch (e) {
      console.warn("Session storage clear warning:", e);
    }
  }

  login(username, password) {
    if (!username || !username.trim()) {
      throw new Error("Please enter your username.");
    }
    if (!password) {
      throw new Error("Please enter your password.");
    }

    const cleanU = username.trim().toLowerCase();
    const isChairmanAttempt = (cleanU === 'chairman' || cleanU === 'admin');

    let user = window.appStore.getUserByUsername(cleanU);
    if (!user && isChairmanAttempt) {
      user = window.appStore.getUsers().find(u => u.role === 'chairman' || u.role === 'admin' || u.id === 'usr_admin');
    }

    if (!user) {
      throw new Error("Invalid username or password. Please try again.");
    }

    // Allow chairman123 or admin123 or stored password for chairman
    const isPasswordMatch = (user.password === password) ||
      (isChairmanAttempt && (password === 'chairman123' || password === 'admin123'));

    if (!isPasswordMatch) {
      throw new Error("Invalid username or password. Please try again.");
    }

    // Normalize Chairman credentials and active status
    if (isChairmanAttempt || user.role === 'admin' || user.id === 'usr_admin') {
      user.role = 'chairman';
      user.status = 'active';
      try {
        const store = window.appStore.getStore();
        const dbU = store.users.find(u => u.id === user.id);
        if (dbU) {
          dbU.role = 'chairman';
          dbU.status = 'active';
          window.appStore.saveStore(store);
        }
      } catch(e) {}
    }

    if (user.status === "inactive") {
      throw new Error("Your account has been deactivated by the Chairman. Access denied.");
    }

    // Record login timestamp for daily attendance tracking
    try {
      const store = window.appStore.getStore();
      const dbUser = store.users.find(u => u.id === user.id);
      if (dbUser) {
        dbUser.lastLoginAt = new Date().toISOString();
        window.appStore.saveStore(store);
      }
    } catch(e) {}

    // Save session without sensitive password
    const sessionUser = {
      id: user.id,
      username: user.username,
      name: user.name,
      role: user.role,
      department: user.department,
      gradeClass: user.gradeClass,
      phone: user.phone
    };

    this.saveSession(sessionUser);
    return sessionUser;
  }

  quickDemoLogin(role) {
    let username = "chairman";
    if (role === "teacher") username = "physics@2026";
    if (role === "student") username = "alex_r";

    const user = window.appStore.getUserByUsername(username);
    if (!user) throw new Error("Demo user not found.");

    return this.login(user.username, user.password || "pass123");
  }

  logout() {
    if (typeof document !== 'undefined' && document.body) {
      document.body.classList.remove("chat-view-active");
      document.documentElement.classList.remove("chat-view-active");
    }
    this.clearSession();
    window.location.hash = "#login";
  }

  getCurrentUser() {
    if (!this.currentUser) {
      this.currentUser = this.loadSession();
    }
    if (!this.currentUser) return null;

    let fresh = null;
    try {
      if (window.appStore && typeof window.appStore.getUserById === 'function') {
        fresh = window.appStore.getUserById(this.currentUser.id);
        if (!fresh && this.currentUser.username) {
          fresh = window.appStore.getUserByUsername(this.currentUser.username);
        }
        if (!fresh && (this.currentUser.role === 'chairman' || this.currentUser.role === 'admin' || this.currentUser.id === 'usr_admin')) {
          fresh = window.appStore.getUsers().find(u => u.role === 'chairman' || u.role === 'admin' || u.id === 'usr_admin');
        }
      }
    } catch(err) {}

    if (fresh) {
      if (fresh.status === "inactive") {
        this.clearSession();
        return null;
      }
      if (fresh.role === 'admin' || fresh.id === 'usr_admin') {
        fresh.role = 'chairman';
      }
      this.currentUser = fresh;
      return fresh;
    }

    // Fallback: If user object exists from persistent storage, keep active! NEVER kick to login
    if (this.currentUser && this.currentUser.id) {
      if (this.currentUser.role === 'admin' || this.currentUser.id === 'usr_admin') {
        this.currentUser.role = 'chairman';
      }
      return this.currentUser;
    }
    return null;
  }

  isAuthenticated() {
    return !!this.getCurrentUser();
  }
}

  // Binary Blob File Downloader Trigger

  async downloadRecord(type, id) {
    const store = window.appStore.getStore();
    let record;
    if (type === 'assignment') record = (store.assignments || []).find(x => x.id === id);
    else if (type === 'note') record = (store.notes || []).find(x => x.id === id);
    else if (type === 'homework') record = (store.homeworks || []).find(x => x.id === id);
    else if (type === 'syllabus') record = (store.syllabuses || []).find(x => x.id === id);

    else if (type === 'submission') record = (store.submissions || []).find(x => x.id === id);
    
    if (!record) return UI.showToast("Record not found. It may have been deleted.", "error");
    
    let fileName = record.attachmentName || record.fileName || (record.title ? `${record.title.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf` : "Loom_Document.pdf");
    if (!fileName.toLowerCase().endsWith(".pdf")) fileName += ".pdf";
    
    let fileType = record.attachmentType || record.fileType || "application/pdf";

    // If not in local store, try fetching from cloud file store
    if (!fileContent && typeof FIREBASE_URL !== 'undefined') {
      try {

        const res = await fetch(`${FIREBASE_URL}/file/${id}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {

            // Cache locally
            record.fileContent = fileContent;
            record.attachmentContent = fileContent;
          }
        }
      } catch(e) {
        console.warn("Cloud file fetch failed:", e);

  async downloadFile(fileName, fileType, fileContent) {
    try {
      if (!fileContent) throw new Error("Empty file content");
      
      let blob;
      if (fileContent instanceof Blob) {
        blob = fileContent;
      } else if (typeof fileContent === "string" && fileContent.startsWith("data:")) {
        // Use modern fetch API to safely and quickly decode massive base64 Data URLs
        const res = await fetch(fileContent);
        blob = await res.blob();
      } else {
        blob = new Blob([fileContent], { type: fileType || "application/pdf" });
      }

      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = blobUrl;
      link.download = fileName || "JEE_Document.pdf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
      UI.showToast(`Downloading '${fileName}' to device...`, "success");
    } catch (e) {
      console.error("Download Error:", e);
      UI.showToast("Failed to process file download. Please try again.", "error");
    }
  },

  handleChangePasswordSubmit(e) {
    e.preventDefault();
    const errDiv = document.getElementById("cp-error");
    if (errDiv) errDiv.style.display = "none";

    const currentPw = document.getElementById("cp-current").value;
    const newPw = document.getElementById("cp-new").value;
    const confirmPw = document.getElementById("cp-confirm").value;

    const user = window.appAuth.getCurrentUser();
    if (!user) return;

    const store = window.appStore.getStore();
    const dbUser = store.users.find(u => u.id === user.id);
    if (!dbUser) {
      if (errDiv) { errDiv.innerText = "User account record not found."; errDiv.style.display = "block"; }
      return;
    }

    const isChairman = (dbUser.role === 'chairman' || dbUser.role === 'admin' || dbUser.id === 'usr_admin');
    const validCurrent = (dbUser.password === currentPw) || (isChairman && (currentPw === 'chairman123' || currentPw === 'admin123'));

    if (!validCurrent) {
      if (errDiv) { errDiv.innerText = "Incorrect current password. Please try again."; errDiv.style.display = "block"; }
      return;
    }

    if (newPw !== confirmPw) {
      if (errDiv) { errDiv.innerText = "New passwords do not match. Please re-confirm."; errDiv.style.display = "block"; }
      return;
    }

    if (newPw.length < 4) {
      if (errDiv) { errDiv.innerText = "Password must be at least 4 characters."; errDiv.style.display = "block"; }
      return;
    }

    dbUser.password = newPw;
    window.appStore.saveStore(store);

    if (typeof CloudSync !== 'undefined' && typeof CloudSync.pushKey === 'function') {
      CloudSync.pushKey('users', store.users);
    }

    UI.closeModal();
    UI.showToast("🔑 Password successfully changed! Please remember your new password.", "success");

      const d = new Date(u.lastLoginAt);
      const isToday = d.toDateString() === todayStr;
      const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' });

      if (isToday) {
        return `<span style="background:rgba(16,185,129,0.18); color:#34d399; border:1px solid rgba(16,185,129,0.35); padding:3px 8px; border-radius:6px; font-weight:700; font-size:0.76rem; display:inline-flex; align-items:center; gap:4px;">🟢 Today, ${timeStr}</span>`;
      } else {
        return `<span style="background:rgba(239,68,68,0.12); color:#fca5a5; border:1px solid rgba(239,68,68,0.25); padding:3px 8px; border-radius:6px; font-weight:600; font-size:0.76rem; display:inline-flex; align-items:center; gap:4px;">🔴 ${dateStr}, ${timeStr}</span>`;
      }

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">

  openEditUserModal(userId) {
    const user = window.appStore.getUserById(userId);
    if (!user) return;

    const isTeacher = user.role === "teacher";
    const extraLabel = isTeacher ? "Department / Specialization / Designation" : "Target Batch / Stream";

    const body = `
      <form onsubmit="UI.handleEditUserSubmit(event, '${user.id}')">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="edit-name" class="form-control" value="${user.name}" required />
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="edit-username" class="form-control" value="${user.username}" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="text" id="edit-password" class="form-control" value="${user.password}" required />
        </div>
        <div class="form-group">
          <label class="form-label">${extraLabel}</label>
          <input type="text" id="edit-extra" class="form-control" value="${user.department || user.gradeClass || ''}" required />
        </div>
        <div class="form-group">
          <label class="form-label">Mobile Phone Number</label>
          <input type="text" id="edit-phone" class="form-control" value="${user.phone || '+91 94933 49113'}" required />
        </div>
        <div class="form-group">
          <label class="form-label">Account Status</label>
          <select id="edit-status" class="form-control" required>
            <option value="active" ${user.status === 'active' ? 'selected' : ''}>Active</option>
            <option value="inactive" ${user.status === 'inactive' ? 'selected' : ''}>Inactive</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:10px;">
          Save Account Changes
        </button>
      </form>
    `;
    UI.openModal(`Edit Account: ${user.name}`, body);
  },

  handleEditUserSubmit(e, userId) {
    e.preventDefault();
    const user = window.appStore.getUserById(userId);

    const name = document.getElementById("edit-name").value;
    const username = document.getElementById("edit-username").value;
    const password = document.getElementById("edit-password").value;
    const extra = document.getElementById("edit-extra").value;
    const phone = document.getElementById("edit-phone").value;
    const status = document.getElementById("edit-status").value;

    const fields = {
      name,
      username,
      password,
      phone,
      status
    };

    if (user.role === "teacher") {
      fields.department = extra;
    } else {
      fields.gradeClass = extra;
    }

    try {
      window.appStore.updateUser(userId, fields);
      UI.closeModal();
      UI.showToast(`Account credentials and details updated for '${name}'!`, "success");
      UI.renderChairmanPage("users", user.role === "teacher" ? "teachers" : "students");
    } catch (err) {
      UI.showToast(err.message, "error");
    }
  },

  handlePublishSyllabusSubmit(e) {
    e.preventDefault();
    const user = window.appAuth.getCurrentUser();
    const fileInput = document.getElementById("syl-file");
    if (!fileInput.files || !fileInput.files[0]) {
      UI.showToast("Please select a PDF file to upload.", "error");
      return;
    }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        window.appStore.createSyllabus({
          examTitle: document.getElementById("syl-title").value,
          examDate: document.getElementById("syl-date").value,
          examType: document.getElementById("syl-type").value,
          targetBatch: document.getElementById("syl-batch").value,
          physicsSyllabus: document.getElementById("syl-note").value || "",
          chemSyllabus: "",
          mathsSyllabus: "",
          postedBy: user.name,
          fileName: file.name,
          fileType: file.type,
          fileSize: (file.size / 1024).toFixed(1) + " KB",
          fileContent: ev.target.result
        });
        UI.closeModal();
        UI.showToast("Exam syllabus published successfully!", "success");
        UI.renderChairmanPage("syllabuses");
      } catch(err) {
        UI.showToast(err.message, "error");
      }
    };
    reader.readAsDataURL(file);
  },

                    <span>${escapeHtml(u.name)}</span>

            ${(activeTargetObj?.name || 'Chat').charAt(0)}

              <span>${escapeHtml(activeTargetObj?.name || 'Discussion Room')}</span>
              ${isTargetMgmt ? `<span style="background:linear-gradient(135deg,rgba(249,115,22,0.25),rgba(234,88,12,0.35));color:#ffedd5;border:1px solid rgba(249,115,22,0.55);font-size:0.65rem;padding:2px 7px;border-radius:6px;font-weight:800;letter-spacing:0.5px;">👑 ${targetRoleDisplay}</span>` : ''}

            </div>
          </div>
          <button onclick="UI.clearCurrentChat('${activeChannel}')" style="background:rgba(255,255,255,0.07);border:1px solid var(--border-light);border-radius:8px;color:#f59e0b;font-size:0.73rem;padding:5px 9px;cursor:pointer;flex-shrink:0;">&#128465; Clear</button>
          ${(currentUser.role === 'chairman' || currentUser.role === 'admin') ? `<button onclick="UI.deleteAllChats()" style="background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-size:0.73rem;padding:5px 9px;cursor:pointer;flex-shrink:0;">&#9888; Delete All</button>` : ''}

            <button type="button" class="wa-attach-btn" onclick="document.getElementById('chat-file-input').click()">&#128206;</button>

  renderChatMessageItem(m, currentUser) {
    const isMe = m.senderId === currentUser.id;
    const canDelete = isMe || currentUser.role === 'chairman' || currentUser.role === 'admin';
    const isSeen = m.recipientId ? (m.readBy && m.readBy.includes(m.recipientId)) : true;
    const ticks = isMe ? (isSeen ? '<span style="color:#a78bfa;font-size:0.72rem;">&#10003;&#10003;</span>' : '<span style="color:rgba(255,255,255,0.4);font-size:0.72rem;">&#10003;</span>') : '';

    const senderUser = window.appStore ? window.appStore.getUserById(m.senderId) : null;
    const rawRole = (m.senderRole || (senderUser && senderUser.role) || (isMe ? currentUser.role : '') || '').toLowerCase();
    const isMgmtSender = ['chairman', 'admin', 'ceo', 'md', 'co-chairman', 'principal', 'management'].includes(rawRole);
    const roleDisplay = rawRole === 'admin' ? 'CHAIRMAN' : rawRole.toUpperCase();

    const senderHtml = !isMe ? (
      isMgmtSender ? `
        <div class="wa-sender" style="color:#fb923c;font-weight:800;display:flex;align-items:center;gap:5px;margin-bottom:3px;">
          <span style="font-size:0.92rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4));">👑</span>
          <span style="color:#fdba74;font-weight:800;">${escapeHtml(m.senderName)}</span>
          <span style="font-size:0.62rem;background:linear-gradient(135deg,rgba(249,115,22,0.3),rgba(234,88,12,0.45));color:#ffedd5;border:1px solid rgba(249,115,22,0.65);padding:1px 6px;border-radius:4px;font-weight:800;letter-spacing:0.5px;box-shadow:0 1px 4px rgba(249,115,22,0.25);">👑 ${roleDisplay}</span>
        </div>
      ` : `<div class="wa-sender">${escapeHtml(m.senderName)}</div>`
    ) : (
      isMgmtSender ? `
        <div style="font-size:0.62rem;color:#fdba74;font-weight:800;display:flex;align-items:center;gap:3px;margin-bottom:3px;justify-content:flex-end;">
          <span>👑</span>
          <span style="background:rgba(249,115,22,0.3);color:#ffedd5;border:1px solid rgba(249,115,22,0.5);padding:1px 5px;border-radius:4px;">${roleDisplay}</span>
        </div>
      ` : ''
    );

    return `
      <div class="wa-bubble-wrap ${isMe ? 'me' : 'them'}" data-msg-id="${m.id}">
        ${canDelete ? '<button class="wa-del-btn" onclick="UI.deleteChatMsg(\'' + m.id + '\')" title="Delete">&#10005;</button>' : ''}
        ${senderHtml}
        <div class="wa-bubble ${isMe ? 'me' : 'them'} ${isMgmtSender ? 'wa-mgmt-bubble' : ''}">
          ${m.text ? '<div>' + escapeHtml(m.text) + '</div>' : ''}
          ${m.attachmentContent ? '<div class="wa-attachment"><span style="font-size:0.78rem;">&#128206; ' + escapeHtml(m.attachmentName) + '</span><button class="btn btn-sm btn-secondary" onclick="UI.downloadRecord(\'chat\',\'' + m.id + '\')">&#11015;</button></div>' : ''}
        </div>
        <div class="wa-meta">
          <span>${new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
          ${ticks}
        </div>
      </div>
    `;
  },

  openSidebar() {
    const s = document.getElementById('wa-sidebar');
    if (s) s.classList.add('wa-open');
  },

  closeSidebar() {
    const s = document.getElementById('wa-sidebar');
    if (s) s.classList.remove('wa-open');
  },

  filterContacts(query) {
    const items = document.querySelectorAll('.wa-contact-item');
    items.forEach(item => {
      const name = item.querySelector('.wa-contact-name')?.textContent?.toLowerCase() || '';
      item.style.display = name.includes(query.toLowerCase()) ? 'flex' : 'none';
    });
  },

  deleteChatMsg(msgId) {
    
    try {
      window.appStore.deleteChatMessage(msgId);
      const el = document.querySelector(`[data-msg-id="${msgId}"]`);
      if (el) el.remove();
    } catch(e) {
      UI.showToast(e.message, 'error');
    }
  },

  clearCurrentChat(channelId) {
    
    try {
      const store = window.appStore.getStore();
      store.chatMessages = (store.chatMessages || []).filter(m => {
        if (!channelId) return true;
        const PUBLIC_CHANNELS = ["general_announcements","phy_doubts","chem_doubts","maths_doubts"];
        if (PUBLIC_CHANNELS.includes(channelId)) {
          return m.channelId !== channelId;
        } else {
          return !(
            (m.senderId === channelId || m.recipientId === channelId) ||
            (m.senderId === window.appAuth.getCurrentUser().id && m.recipientId === channelId) ||
            (m.recipientId === window.appAuth.getCurrentUser().id && m.senderId === channelId)
          );
        }
      });
      window.appStore.saveStore(store);
      UI.showToast('Chat cleared!', 'success');
      const user = window.appAuth.getCurrentUser();
      const isMgmt = ['chairman', 'admin', 'ceo', 'md', 'co-chairman', 'principal', 'management'].includes((user.role || '').toLowerCase());
      if (isMgmt) UI.renderChairmanPage('chat');
      else if (user.role === 'teacher') UI.renderTeacherPage('chat');
      else UI.renderStudentPage('chat');
    } catch(e) {
      UI.showToast(e.message, 'error');
    }
  },

  deleteAllChats() {
    if (!confirm("Are you sure you want to permanently delete all chat messages? This action cannot be undone.")) return;
    try {
      const store = window.appStore.getStore();
      store.chatMessages = [];
      window.appStore.saveStore(store);
      UI.showToast('All chats deleted!', 'success');
      UI.renderChairmanPage('chat');
    } catch(e) {
      UI.showToast(e.message, 'error');
    }
  },

  quickSwitchUser(userId) {
    const user = window.appStore.getUserById(userId);
    if (!user) return;
    const sessionUser = {
      id: user.id,
      username: user.username,
      name: user.name,
      role: user.role,
      department: user.department,
      gradeClass: user.gradeClass,
      phone: user.phone
    };
    window.appAuth.saveSession(sessionUser);
    const isMgmt = ['chairman', 'admin', 'ceo', 'md', 'co-chairman', 'principal', 'management'].includes((user.role || '').toLowerCase());
    window.location.hash = isMgmt ? '#chairman' : `#${user.role}`;
    if (isMgmt) UI.renderChairmanPage('chat');
    else if (user.role === 'teacher') UI.renderTeacherPage('chat');
    else if (user.role === 'student') UI.renderStudentPage('chat');
    UI.showToast(`Switched identity to ${user.name} (${user.role.toUpperCase()})`, "success");
  },

  switchChatChannel(channelId) {
    UI._chatRenderedIds = null;
    UI.activeChatChannel = channelId;
    const user = window.appAuth.getCurrentUser();
    const isMgmt = ['chairman', 'admin', 'ceo', 'md', 'co-chairman', 'principal', 'management'].includes((user.role || '').toLowerCase());
    if (isMgmt) UI.renderChairmanPage('chat');
    else if (user.role === 'teacher') UI.renderTeacherPage('chat');
    else if (user.role === 'student') UI.renderStudentPage('chat');
  },

  appendSingleChatMessage(m, currentUser) {
    const container = document.getElementById("chat-messages-container");
    if (!container) return;
    if (UI._chatRenderedIds && UI._chatRenderedIds.has(m.id)) return;
    if (!UI._chatRenderedIds && container.querySelector(`[data-msg-id="${m.id}"]`)) return;

    if (container.children.length === 1 && container.innerText.includes("No messages")) {
      container.innerHTML = "";
    }

    const temp = document.createElement("div");
    temp.innerHTML = UI.renderChatMessageItem(m, currentUser).trim();
    const el = temp.firstElementChild;
    if (el) {
      container.appendChild(el);
      if (!UI._chatRenderedIds) UI._chatRenderedIds = new Set();
      UI._chatRenderedIds.add(m.id);
    }
    this.scrollChatToBottom();
  },

  startChatPolling() {
    if (UI.chatInterval) clearInterval(UI.chatInterval);
    UI.chatInterval = setInterval(() => {
      try {
        const container = document.getElementById("chat-messages-container");
        if (!container) {
          clearInterval(UI.chatInterval);
          UI.chatInterval = null;
          return;
        }
        const user = window.appAuth ? window.appAuth.getCurrentUser() : null;
        if (!user) return;

        const activeChannel = UI.activeChatChannel || "general_announcements";
        const msgs = window.appStore.getChatMessages(activeChannel, user.id);
        
        if (!UI._chatRenderedIds) {
          UI._chatRenderedIds = new Set();
          container.querySelectorAll('[data-msg-id]').forEach(el => {
            const id = el.getAttribute('data-msg-id');
            if (id) UI._chatRenderedIds.add(id);
          });
        }

        for (let i = 0; i < msgs.length; i++) {
          const m = msgs[i];
          if (!UI._chatRenderedIds.has(m.id)) {
            UI.appendSingleChatMessage(m, user);
          }
        }
      } catch(e) { console.warn("Poll error:", e); }
    }, 2000);
  },

  scrollChatToBottom() {
    setTimeout(() => {
      const container = document.getElementById("chat-messages-container");
      if (container) container.scrollTop = container.scrollHeight;
    }, 20);
  },

  handleChatFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      UI.chatAttachmentDataUrl = evt.target.result;
      UI.chatAttachmentFileObj = file;
      const prev = document.getElementById("chat-file-preview");
      if (prev) {
        prev.innerText = `✓ Attachment Ready: ${file.name}`;
        prev.style.display = "block";
      }
    };
    reader.readAsDataURL(file);
  },

  handleSendChatMessage(e) {
    if (e && e.preventDefault) e.preventDefault();
    const currentUser = window.appAuth.getCurrentUser();
    if (!currentUser) return;

    const textInput = document.getElementById("chat-text-input");
    const text = textInput ? textInput.value : "";

    const activeTarget = UI.activeChatChannel || "general_announcements";
    const PUBLIC_CHANNELS = ["general_announcements", "phy_doubts", "chem_doubts", "maths_doubts"];

    let channelId = null;
    let recipientId = null;

    if (PUBLIC_CHANNELS.includes(activeTarget)) {
      channelId = activeTarget;
    } else {
      recipientId = activeTarget;
    }

    let attachmentName = "";
    let attachmentType = "";
    let attachmentContent = "";

    if (UI.chatAttachmentFileObj) {
      attachmentName = UI.chatAttachmentFileObj.name;
      attachmentType = UI.chatAttachmentFileObj.type || "application/pdf";
      attachmentContent = UI.chatAttachmentDataUrl && UI.chatAttachmentDataUrl.length < 8000000 ? UI.chatAttachmentDataUrl : "";
    }

    if (!text.trim() && !attachmentName) {
      UI.showToast("Please enter a message or attach a file.", "error");
      return;
    }

    try {
      const newMsg = window.appStore.sendChatMessage({
        channelId,
        recipientId,
        senderId: currentUser.id,
        senderName: currentUser.name,
        senderRole: currentUser.role,
        text,
        attachmentName,
        attachmentType,
        attachmentContent
      });

      // Clear Inputs
      UI.chatAttachmentFileObj = null;
      UI.chatAttachmentDataUrl = null;
      if (textInput) textInput.value = "";
      
      const fileInput = document.getElementById("chat-file-input");
      if (fileInput) fileInput.value = "";

      const prev = document.getElementById("chat-file-preview");
      if (prev) prev.style.display = "none";

      // 0ms WhatsApp-style Instant Local Bubble Append
      UI.appendSingleChatMessage(newMsg, currentUser);

      // Background Cloud Sync

        setTimeout(() => {

        }, 0);
      }

  async handlePostHomeworkSubmit(e) {
    e.preventDefault();
    if (UI.isReadingFile) {
      return UI.showToast("Please wait a moment while your PDF file finishes loading...", "warning");
    }

    const teacher = window.appAuth.getCurrentUser();
    const title = document.getElementById("hw-title").value;
    const subject = document.getElementById("hw-subject").value;
    const dueDate = document.getElementById("hw-date").value;
    const dueTime = document.getElementById("hw-time").value;
    const targetBatch = document.getElementById("hw-batch").value;
    const instructions = document.getElementById("hw-instructions").value;

    let fileName = "";
    let fileSize = "";
    let fileType = "";
    let fileContent = "";

    if (UI.selectedHwFileObj) {
      fileName = UI.selectedHwFileObj.name;
      fileSize = `${(UI.selectedHwFileObj.size / 1024).toFixed(1)} KB`;
      fileType = UI.selectedHwFileObj.type || "application/pdf";
      fileContent = UI.selectedHwDataUrl || "";
    }

    try {
      const newHwRecord = window.appStore.createHomework({
        title,
        subject,
        instructions,
        dueDate,
        dueTime,
        targetBatch,
        teacherId: teacher.id,
        teacherName: teacher.name,
        fileName,
        fileSize,
        fileType,
        fileContent
      });

      // Upload full PDF to dedicated cloud file store (await so teacher sees real status)
      if (fileContent && newHwRecord && newHwRecord.id && typeof FIREBASE_URL !== 'undefined') {
        try {
          UI.showToast(`☁️ Uploading PDF to cloud... Please wait.`, "success");
          const uploadRes = await fetch(`${FIREBASE_URL}/file/${newHwRecord.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: fileContent})
          });
          if (uploadRes.ok) {
            console.log("[FileStore] Homework PDF uploaded successfully");
          } else {
            console.warn("[FileStore] Homework PDF upload returned:", uploadRes.status);
          }
        } catch(uploadErr) {
          console.warn("[FileStore] Cloud upload notice:", uploadErr);
        }
      }

      UI.selectedHwFileObj = null;
      UI.selectedHwDataUrl = null;
      UI.closeModal();
      UI.showToast(`Daily Homework '${title}' posted!`, "success");
      if (teacher.role === 'chairman') UI.renderChairmanPage("homeworks");
      else UI.renderTeacherPage("homeworks");
    } catch (err) {
      UI.showToast(err.message, "error");
    }
  },

  handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const txt = document.getElementById("dropzone-text");
    if (txt) txt.innerHTML = `<span style="color:#f59e0b;">⏳ Processing PDF File (${(file.size / (1024*1024)).toFixed(2)} MB)... Please wait...</span>`;
    UI.isReadingFile = true;

    const reader = new FileReader();
    reader.onload = function(evt) {
      UI.selectedFileDataUrl = evt.target.result;
      UI.selectedFileObj = file;
      UI.isReadingFile = false;
      if (txt) txt.innerHTML = `<span style="color:var(--brand-accent);">✓ PDF File Ready: ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>`;
    };
    reader.onerror = function() {
      UI.isReadingFile = false;
      if (txt) txt.innerHTML = `<span style="color:#ef4444;">❌ Failed to read file. Please select again.</span>`;
    };
    reader.readAsDataURL(file);
  },

  async handleCreateAssignmentSubmit(e) {
    e.preventDefault();
    if (UI.isReadingFile) {
      return UI.showToast("Please wait a moment while your PDF file finishes loading...", "warning");
    }

    const teacher = window.appAuth.getCurrentUser();
    const title = document.getElementById("asgn-title").value;
    const subject = document.getElementById("asgn-subject").value;
    const dueElem = document.getElementById("asgn-due");
    const dueDate = dueElem ? dueElem.value : new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0];
    const description = document.getElementById("asgn-desc").value;

    let fileName = "";
    let fileSize = "";
    let fileType = "";
    let fileContent = "";

    if (UI.selectedFileObj) {
      fileName = UI.selectedFileObj.name;
      fileSize = `${(UI.selectedFileObj.size / 1024).toFixed(1)} KB`;
      fileType = UI.selectedFileObj.type || "application/pdf";
      fileContent = UI.selectedFileDataUrl || "";
    }

    try {
      const newRecord = window.appStore.createAssignment({
        title,
        subject,
        description,
        dueDate,
        teacherId: teacher.id,
        teacherName: teacher.name,
        fileName,
        fileSize,
        fileType,
        fileContent
      });

      // Upload full PDF file to dedicated cloud file store (await so teacher sees real status)
      if (fileContent && newRecord && newRecord.id && typeof FIREBASE_URL !== 'undefined') {
        try {
          UI.showToast(`☁️ Uploading PDF to cloud... Please wait.`, "success");
          const uploadRes = await fetch(`${FIREBASE_URL}/file/${newRecord.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: fileContent})
          });
          if (uploadRes.ok) {
            console.log("[FileStore] Assignment PDF uploaded successfully");
          } else {
            console.warn("[FileStore] Assignment PDF upload returned:", uploadRes.status);
          }
        } catch(uploadErr) {
          console.warn("[FileStore] Cloud upload notice:", uploadErr);
        }
      }

      UI.selectedFileObj = null;
      UI.selectedFileDataUrl = null;
      UI.closeModal();
      UI.showToast(`JEE DPP '${title}' created successfully!`, "success");
      if (teacher.role === 'chairman') UI.renderChairmanPage("assignments");
      else UI.renderTeacherPage("assignments");
    } catch (err) {
      UI.showToast(err.message, "error");
    }
  },

    UI.openModal("Assign to JEE Aspirant Batches", body);

  selectClassGroup(className) {
    const cbs = document.querySelectorAll(`.target-student-cb[data-class="${className}"]`);
    cbs.forEach(cb => cb.checked = true);
    UI.showToast(`Selected all aspirants in ${className}`, "success");

  handleAssignSubmit(e, assignmentId) {
    e.preventDefault();
    const cbs = document.querySelectorAll(".target-student-cb:checked");

  filterDirectoryCards(query) {
    const term = (query || '').toLowerCase().trim();
    const activeCategory = UI.activeDirectoryCategory || 'all';
    const cards = document.querySelectorAll('.directory-card');
    let visibleCount = 0;

    cards.forEach(card => {
      const searchData = card.getAttribute('data-search') || '';
      const category = card.getAttribute('data-category') || '';
      const matchesCategory = (activeCategory === 'all' || category === activeCategory);
      const matchesSearch = !term || searchData.includes(term);

      if (matchesCategory && matchesSearch) {
        card.style.display = 'flex';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });

    const emptyMsg = document.getElementById('directory-empty-msg');
    if (emptyMsg) {
      emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
    }
  },

  filterDirectoryCategory(cat, btnEl) {
    UI.activeDirectoryCategory = cat;
    if (btnEl && btnEl.parentElement) {
      btnEl.parentElement.querySelectorAll('button').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-secondary');
      });
      btnEl.classList.remove('btn-secondary');
      btnEl.classList.add('btn-primary');
    }
    const searchInput = document.getElementById('directory-search-input');
    UI.filterDirectoryCards(searchInput ? searchInput.value : '');
  },

  chatWithUser(userId) {
    UI.activeChatChannel = userId;
    const user = window.appAuth.getCurrentUser();
    if (user.role === 'student') {
      UI.renderStudentPage('chat');
    } else if (user.role === 'teacher') {
      UI.renderTeacherPage('chat');
    } else {

    }

  copyToClipboard(text, msg = "Copied to clipboard!") {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        UI.showToast(msg, 'success');
      }).catch(() => {
        UI.fallbackCopyText(text, msg);
      });
    } else {
      UI.fallbackCopyText(text, msg);
    }
  },

  fallbackCopyText(text, msg) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      UI.showToast(msg, 'success');
    } catch (err) {
      UI.showToast("Failed to copy", 'error');
    }
    document.body.removeChild(textArea);
  },

  initTheme() {
    try {
      localStorage.removeItem('portal_theme');
      if (document.documentElement) document.documentElement.classList.remove('light-theme');
      if (document.body) document.body.classList.remove('light-theme');
    } catch(e) {}

    e.preventDefault();

    const reader = new FileReader();

          fileName: file.name,
          fileType: file.type || "application/pdf",
