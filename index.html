// Public 24/7 Cloud Backend API URL (set to your hosted API backend URL when deployed online)
const PUBLIC_API_URL = window.POSTGRES_API_URL || 'https://loom-4e53.onrender.com/api';

const FIREBASE_URL = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:5000/api'
  : PUBLIC_API_URL;

window.NotificationManager = {
  items: [],

  init() {
    try {
      const saved = localStorage.getItem('inter_jee_notifications_v2');
      if (saved) this.items = JSON.parse(saved);
    } catch(e) { this.items = []; }
    this.updateBellBadge();
    
    if ("Notification" in window && Notification.permission === "default") {
      document.addEventListener('click', () => {
        Notification.requestPermission();
      }, { once: true });
    }
  },

  add(type, title, message, actionRoute) {
    const icons = {
      chat: '💬',
      assignment: '📝',
      note: '📚',
      homework: '🏠',
      syllabus: '📅'
    };

    const notif = {
      id: 'n_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
      type: type || 'chat',
      icon: icons[type] || '🔔',
      title: title || 'New Notification',
      message: message || '',
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      date: new Date().toLocaleDateString(),
      timestamp: Date.now(),
      read: false,
      actionRoute: actionRoute || null
    };

    this.items.unshift(notif);
    if (this.items.length > 40) this.items = this.items.slice(0, 40);
    try {
      localStorage.setItem('inter_jee_notifications_v2', JSON.stringify(this.items));
    } catch(e) {}

    // In-app Toast Notification
    if (window.UI && window.UI.showToast) {
      window.UI.showToast(`${notif.icon} ${title}: ${message}`, "success");
    }

    // Web Browser Native Desktop Notification
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        const n = new Notification(`Inter JEE: ${title}`, {
          body: message,
          tag: notif.id
        });
        n.onclick = function() {
          window.focus();
          if (actionRoute && window.app) window.app.handleRoute(actionRoute);
        };
      } catch(e) {}
    }

    // Web Audio Chime Sound Effect
    this.playChime();

    this.updateBellBadge();
    this.renderList();
  },

  playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch(e) {}
  },

  getUnreadCount() {
    return this.items.filter(n => !n.read).length;
  },

  markAllAsRead() {
    this.items.forEach(n => n.read = true);
    try {
      localStorage.setItem('inter_jee_notifications_v2', JSON.stringify(this.items));
    } catch(e) {}
    this.updateBellBadge();
    this.renderList();
  },

  clearAll() {
    this.items = [];
    try {
      localStorage.setItem('inter_jee_notifications_v2', JSON.stringify(this.items));
    } catch(e) {}
    this.updateBellBadge();
    this.renderList();
    if (window.UI && window.UI.showToast) {
      window.UI.showToast("All notifications cleared!", "success");
    }
  },

  deleteItem(id, event) {
    if (event) event.stopPropagation();
    this.items = this.items.filter(n => n.id !== id);
    try {
      localStorage.setItem('inter_jee_notifications_v2', JSON.stringify(this.items));
    } catch(e) {}
    this.updateBellBadge();
    this.renderList();
  },

  updateBellBadge() {
    const badge = document.getElementById("notif-bell-badge");
    const count = this.getUnreadCount();
    if (!badge) return;
    if (count > 0) {
      badge.style.display = "inline-flex";
      badge.innerText = count > 99 ? '99+' : count;
    } else {
      badge.style.display = "none";
    }
  },

  renderList() {
    const container = document.getElementById("notif-panel-list");
    if (!container) return;
    if (this.items.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:35px 10px; color:var(--text-muted); font-size:0.85rem;">No notifications yet. New updates will appear here in real-time!</div>`;
      return;
    }
    container.innerHTML = this.items.map(item => `
      <div class="notif-item ${item.read ? '' : 'unread'}" onclick="NotificationManager.handleItemClick('${item.id}', '${item.actionRoute || ''}')">
        <div class="notif-icon">${item.icon}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700; font-size:0.84rem; color:#fff; display:flex; justify-content:space-between; align-items:center;">
            <span>${escapeHtml(item.title)}</span>
            <span style="font-weight:400; font-size:0.7rem; color:var(--text-dim);">${item.time}</span>
          </div>
          <div style="font-size:0.78rem; color:var(--text-muted); margin-top:2px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">${escapeHtml(item.message)}</div>
        </div>
        <button class="notif-item-del-btn" onclick="NotificationManager.deleteItem('${item.id}', event)" title="Dismiss notification">&times;</button>
      </div>
    `).join('');
  },

  handleItemClick(id, actionRoute) {
    const item = this.items.find(n => n.id === id);
    if (item) item.read = true;
    try {
      localStorage.setItem('inter_jee_notifications_v2', JSON.stringify(this.items));
    } catch(e) {}
    this.updateBellBadge();
    this.renderList();
    this.togglePanel();
    if (actionRoute && window.app) {
      window.app.handleRoute(actionRoute);
    }
  },

  togglePanel() {
    const panel = document.getElementById("notif-panel-modal");
    if (!panel) return;
    if (panel.style.display === "none" || !panel.style.display) {
      panel.style.display = "flex";
      this.renderList();
      this.markAllAsRead();
    } else {
      panel.style.display = "none";
    }
  }
};

NotificationManager.init();

const CloudSync = {
  _pushing: false,
  _pendingPush: false,
  _lastKnownUpdatedAt: null,
  _lastEtag: null,

  // Pull fresh data from cloud and merge into localStorage (Fast 28-byte timestamp check saves 99.9% bandwidth & CPU)
  async pull() {
    try {
      const getTimeoutSignal = (ms = 6000) => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;

      let remoteTimestamp = null;
      // STEP 1: Fast 28-byte timestamp check (avoids downloading 225KB payload when nothing has changed)
      try {
        const checkRes = await fetch(FIREBASE_URL + '/store/updatedAt.json', { signal: getTimeoutSignal(3500) });
        if (checkRes.ok) {
          remoteTimestamp = await checkRes.json();
          if (this._hasPulledOnce && remoteTimestamp && this._lastKnownUpdatedAt && remoteTimestamp === this._lastKnownUpdatedAt) {
            // Cloud has not changed! Zero bytes of heavy JSON downloaded!
            return;
          }
        }
      } catch(e) {
        // If timestamp check times out or network is offline, skip this cycle to prevent UI freeze
        if (this._hasPulledOnce) return;
      }

      const res = await fetch(FIREBASE_URL + '/store.json', { signal: getTimeoutSignal(7000) });
      if (!res.ok) return;

      const cloud = await res.json() || {};
      const local = window.appStore.getStore();

      // Helper function to safely convert Firebase arrays/objects to clean JS Arrays
      const ensureArray = (val) => {
        if (!val) return [];
        if (Array.isArray(val)) return val.filter(Boolean);
        if (typeof val === 'object') return Object.values(val).filter(Boolean);
        return [];
      };

      // If cloud DB is empty on initial pull, push local data to seed the PostgreSQL DB!
      if (!this._hasPulledOnce && Object.keys(cloud).length === 0) {
        this._hasPulledOnce = true;
        await this.push(local);
        return;
      }

      // ANTI-WIPE PROTECTION: Count total items in cloud vs local.
      // If cloud has drastically fewer items than local (less than 20%), the server likely
      // restarted and wiped its database (common on Render/Wasmer free tier).
      // Re-seed the cloud from local instead of allowing local data to be wiped.
      const dataKeys = ['assignments', 'notes', 'homeworks', 'syllabuses', 'users', 'chatMessages'];
      const cloudTotalItems = dataKeys.reduce((sum, k) => sum + ensureArray(cloud[k]).length, 0);
      const localTotalItems = dataKeys.reduce((sum, k) => sum + ((local[k] || []).length), 0);
      if (localTotalItems >= 3 && cloudTotalItems < Math.ceil(localTotalItems * 0.2)) {
        console.warn(`[CloudSync] ⚠️ Server-wipe detected! Cloud has ${cloudTotalItems} items vs local ${localTotalItems}. Re-seeding cloud from local...`);
        this._hasPulledOnce = true;
        await this.push(local);
        return;
      }

      // CRITICAL FIX: If a push() was triggered by the user while we were waiting for the fetch to complete,
      // abort this pull! Otherwise, we will overwrite the user's fresh local changes with stale cloud data!
      if (this._pushing || this._pendingPush) return;

      if (remoteTimestamp) {
        this._lastKnownUpdatedAt = remoteTimestamp;
      }

      let changed = false;

      const currentUser = window.appAuth ? window.appAuth.getCurrentUser() : null;

      // Detect and Notify New Chat Messages
      const cloudChats = ensureArray(cloud.chatMessages);
      if (cloudChats.length > 0) {
        if (!local.chatMessages) local.chatMessages = [];
        const localMsgMap = new Map(local.chatMessages.map(m => [m.id, m]));
        cloudChats.forEach(cm => {
          if (!cm || !cm.id) return;
          if (!this._knownIds.chatMessages.has(cm.id)) {
            if (this._hasPulledOnce && currentUser && cm.senderId !== currentUser.id) {
              window.NotificationManager && window.NotificationManager.add('chat', '💬 New Chat Message', `${cm.senderName || 'User'}: "${cm.text ? cm.text.substring(0, 45) : 'Sent an attachment'}"`, 'chat');
            }
            this._knownIds.chatMessages.add(cm.id);
          }
          const lm = localMsgMap.get(cm.id);
          if (!lm) {
            local.chatMessages.push(cm);
            changed = true;
          } else {
            if (Array.isArray(cm.readBy)) {
              if (!lm.readBy) lm.readBy = [];
              const oldLen = lm.readBy.length;
              cm.readBy.forEach(r => {
                if (!lm.readBy.includes(r)) lm.readBy.push(r);
              });
              if (lm.readBy.length > oldLen) changed = true;
            }
          }
        });
      }

      // Detect and Notify Assignments, Notes, Homeworks, Syllabuses
      const syncKeys = ['assignments', 'notes', 'homeworks', 'syllabuses'];
      const notifLabels = {
        assignments: { type: 'assignment', title: '📝 New Assignment / DPP', getMsg: a => `${a.title} (${a.subject || 'JEE'})` },
        notes: { type: 'note', title: '📚 New Daily Class Notes', getMsg: n => `${n.title} (Topic: ${n.topic || 'Class Notes'})` },
        homeworks: { type: 'homework', title: '🏠 New Daily Homework', getMsg: h => `${h.title} (${h.subject || 'JEE'})` },
        syllabuses: { type: 'syllabus', title: '📅 New Exam Syllabus Schedule', getMsg: s => `${s.examTitle} (${s.examType || 'Mock Exam'})` }
      };

      syncKeys.forEach(k => {
        if (cloud[k] !== undefined) {
          const cloudData = ensureArray(cloud[k]);
          const localArr = local[k] || [];
          const localMap = new Map(localArr.map(x => [x.id, x]));
          const notifMeta = notifLabels[k];

          // ANTI-WIPE: If cloud returned empty array but local has data, never overwrite.
          // This is the main cause of files disappearing after a server restart.
          if (cloudData.length === 0 && localArr.length > 0) {
            console.warn(`[CloudSync] ⚠️ Cloud returned 0 items for '${k}' but local has ${localArr.length}. Skipping overwrite to protect local data.`);
            return;
          }

          cloudData.forEach(item => {
            if (item && item.id) {
              if (!this._knownIds[k].has(item.id)) {
                if (this._hasPulledOnce && notifMeta) {
                  window.NotificationManager && window.NotificationManager.add(notifMeta.type, notifMeta.title, notifMeta.getMsg(item), k);
                }
                this._knownIds[k].add(item.id);
              }
              const loc = localMap.get(item.id);
              if (loc) {
                if (loc.fileContent && !item.fileContent) item.fileContent = loc.fileContent;
                if (loc.attachmentContent && !item.attachmentContent) item.attachmentContent = loc.attachmentContent;
              }
            }
          });
          if (JSON.stringify(localArr) !== JSON.stringify(cloudData)) {
            local[k] = cloudData;
            changed = true;
          }
        }
      });

      // Users Sync: Ensure new students & teachers added on Admin device sync to all devices
      const cloudUsers = ensureArray(cloud.users);
      if (cloudUsers.length > 0) {
        if (JSON.stringify(local.users || []) !== JSON.stringify(cloudUsers)) {
          local.users = cloudUsers;
          changed = true;
        }
      } else if ((local.users || []).length > 0) {
        // ANTI-WIPE: Cloud returned no users but local has accounts — skip overwrite
        console.warn('[CloudSync] ⚠️ Cloud returned no users but local has accounts. Skipping user overwrite to protect accounts.');
      }

      if (changed) {
        window.appStore._writeStoreFromCloud(local);
        window.dispatchEvent(new Event('storage'));
        this.updateStatus('synced', 'Direct Cloud Synced', 'Updated: ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
      }
      this._hasPulledOnce = true;
    } catch(e) { 
      this._hasPulledOnce = true; 
    }
  },

  _knownIds: {
    chatMessages: new Set(),
    assignments: new Set(),
    notes: new Set(),
    homeworks: new Set(),
    syllabuses: new Set()
  },

  _lastUploadDurationStr: null,

  // Update visual sync indicator in top bar and user header
  updateStatus(state, message, timeStr, durationStr) {
    if (durationStr !== undefined) {
      this._lastUploadDurationStr = durationStr;
    }

    const setEl = (dotId, txtId, timeId, durId) => {
      const dot = document.getElementById(dotId);
      const txt = document.getElementById(txtId);
      const time = document.getElementById(timeId);
      const dur = document.getElementById(durId);
      if (!txt) return;

      if (dur) {
        if (this._lastUploadDurationStr) {
          dur.style.display = "inline-flex";
          dur.innerText = "⏱️ Upload: " + this._lastUploadDurationStr;
        } else {
          dur.style.display = "none";
        }
      }

      if (state === 'syncing' || state === 'pushing') {
        if (dot) dot.innerText = '⚡';
        txt.innerText = message || 'Syncing...';
        if (time && timeStr) time.innerText = timeStr;
      } else if (state === 'synced') {
        if (dot) dot.innerText = '🟢';
        txt.innerText = message || 'Cloud Synced';
        if (time) time.innerText = timeStr || ('Updated: ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
      } else if (state === 'error') {
        if (dot) dot.innerText = '⚠️';
        txt.innerText = message || 'Cloud Warning';
        if (time && timeStr) time.innerText = timeStr;
      }
    };

    setEl("sync-dot", "sync-status-text", "sync-last-time", "sync-duration");
    setEl("sync-dot-h", "sync-status-text-h", "sync-last-time-h", "sync-duration-h");
  },

  async manualSync() {
    this.updateStatus('syncing', 'Syncing Data...', 'Now');
    const startT = performance.now();
    try {
      await this.pull();
      if (window.appStore) await this.push(window.appStore.getStore());
      const durMs = Math.round(performance.now() - startT);
      const durStr = durMs < 1000 ? `${durMs}ms` : `${(durMs / 1000).toFixed(2)}s`;
      this.updateStatus('synced', 'Direct Cloud Synced', 'Updated: ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}), durStr);
      if (window.UI && window.UI.showToast) window.UI.showToast(`Direct Cloud Sync Complete (${durStr})`, "success");
    } catch(e) {
      this.updateStatus('error', 'Sync Failed', 'Retry later');
    }
  },

  // Debounced Push trigger
  _pushTimer: null,
  schedulePush(store) {
    if (this._pushTimer) clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => {
      this.push(store || window.appStore.getStore());
    }, 1000);
  },

  _lastPushedHashes: {},

  // Push current store to PostgreSQL (Smart Key-Level Change Detection for 1000x faster uploads)
  async push(store, specificKey = null) {
    if (this._pushing) {
      this._pendingPush = true;
      return;
    }
    this._pushing = true;
    const startT = performance.now();
    this.updateStatus('pushing', 'Syncing to Cloud...', 'Uploading...');

    const optContent = (c) => (typeof c === 'string' && c.length < 20000000) ? c : c;

    try {
      const payload = {
        chatMessages: (store.chatMessages || []).filter(Boolean).slice(-100).map(m => ({
          id: m.id, channelId: m.channelId, recipientId: m.recipientId,
          senderId: m.senderId, senderName: m.senderName, senderRole: m.senderRole,
          text: m.text, timestamp: m.timestamp, readBy: m.readBy || [],
          attachmentName: m.attachmentName || '',
          attachmentType: m.attachmentType || '',
          attachmentContent: optContent(m.attachmentContent)
        })),
        assignments: (store.assignments || []).filter(Boolean).map(a => ({
          id: a.id, title: a.title, subject: a.subject, description: a.description,
          teacherId: a.teacherId, teacherName: a.teacherName, dueDate: a.dueDate,
          createdAt: a.createdAt, fileName: a.fileName, fileType: a.fileType,
          fileSize: a.fileSize, assignedStudents: a.assignedStudents || [],
          fileContent: optContent(a.fileContent)
        })),
        notes: (store.notes || []).filter(Boolean).map(n => ({
          id: n.id, title: n.title, subject: n.subject, topic: n.topic,
          teacherId: n.teacherId, teacherName: n.teacherName, date: n.date,
          targetBatch: n.targetBatch, fileName: n.fileName, fileType: n.fileType,
          fileSize: n.fileSize, createdAt: n.createdAt,
          fileContent: optContent(n.fileContent)
        })),
        homeworks: (store.homeworks || []).filter(Boolean).map(h => ({
          id: h.id, title: h.title, subject: h.subject, instructions: h.instructions,
          dueDate: h.dueDate, dueTime: h.dueTime, targetBatch: h.targetBatch,
          teacherId: h.teacherId, teacherName: h.teacherName,
          fileName: h.fileName || '', createdAt: h.createdAt,
          fileContent: optContent(h.fileContent)
        })),
        syllabuses: (store.syllabuses || []).filter(Boolean).map(s => ({
          id: s.id, examTitle: s.examTitle, examDate: s.examDate, examType: s.examType,
          targetBatch: s.targetBatch, physicsSyllabus: s.physicsSyllabus,
          chemSyllabus: s.chemSyllabus, mathsSyllabus: s.mathsSyllabus,
          postedBy: s.postedBy, createdAt: s.createdAt,
          fileContent: optContent(s.fileContent)
        })),
        users: (store.users || []).filter(Boolean).map(u => ({
          id: u.id, username: u.username, password: u.password, name: u.name,
          role: u.role, phone: u.phone, department: u.department,
          gradeClass: u.gradeClass, status: u.status, createdAt: u.createdAt,
          subscriptionExpiry: u.subscriptionExpiry,
          lastLoginAt: u.lastLoginAt || null,
          attendanceLog: u.attendanceLog || []
        }))
      };

      const heavyKeys = ['assignments', 'notes', 'homeworks', 'syllabuses', 'chatMessages', 'users'];
      const keysToUpload = [];

      for (const k of heavyKeys) {
        if (specificKey && k !== specificKey) continue;
        const str = JSON.stringify(payload[k]);
        if (this._lastPushedHashes[k] !== str) {
          keysToUpload.push({ key: k, str });
        }
      }

      if (keysToUpload.length > 0) {
        await Promise.all([
          ...keysToUpload.map(item => fetch(FIREBASE_URL + '/store/' + item.key + '.json', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: item.str
          }).then(res => {
            if (res.ok) this._lastPushedHashes[item.key] = item.str;
          })),
          fetch(FIREBASE_URL + '/store/updatedAt.json', { 
            method: 'PUT', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(new Date().toISOString()) 
          })
        ]);
      }

      this._lastKnownUpdatedAt = new Date().toISOString();

      const durMs = Math.round(performance.now() - startT);
      const durStr = durMs < 1000 ? `${durMs}ms` : `${(durMs / 1000).toFixed(2)}s`;
      this.updateStatus('synced', 'Direct Cloud Synced', 'Updated: ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}), durStr);
    } catch(e) { 
      console.warn("CloudSync push error:", e.message); 
      this.updateStatus('error', 'Cloud Warning (Local Mode)', 'Will retry');
    }
    finally { 
      this._pushing = false; 
      if (this._pendingPush) {
        this._pendingPush = false;
        if (window.appStore) this.push(window.appStore.getStore());
      }
    }
  },

  _hasPulledOnce: false,

  // Smart polling interval: 3s when in live chat, 10s when active tab, 45s when background/hidden
  startPolling() {
    if (this._pollTimerId) clearTimeout(this._pollTimerId);
    const scheduleNext = () => {
      const isChatActive = !!document.getElementById("chat-messages-container");
      const delay = isChatActive ? 3000 : (document.hidden ? 45000 : 10000);
      this._pollTimerId = setTimeout(async () => {
        await this.pull();
        scheduleNext();
      }, delay);
    };
    scheduleNext();
  }
};

// Hook into store saves to auto-push to cloud
const _origWrite = Store.prototype._writeStore;
Store.prototype._writeStore = function(data) {
  _origWrite.call(this, data);
  // PREVENT CLOUD WIPING BUG: Only push if CloudSync has completed its initial pull!
  if (CloudSync._hasPulledOnce) {
    CloudSync.schedulePush(data);
  }
};

/**
 * Educational Assignment Management App - Router & Main Controller
 */

class App {
  constructor() {
    this.init();
  }

  init() {
    if (window.UI && window.UI.initTheme) {
      window.UI.initTheme();
    }
    window.addEventListener("hashchange", () => this.handleRoute());

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        if (document.body && document.body.classList.contains("chat-view-active")) {
          const container = document.getElementById("chat-messages-container");
          if (container) {
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 60);
          }
        }
      });
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", () => this.handleRoute());
    } else {
      // If DOM is already loaded, render route immediately!
      setTimeout(() => this.handleRoute(), 0);
    }

    window.addEventListener("storage", (e) => {
      // If it's a synthetic event from CloudSync (no e.key) OR a cross-tab event
      if (!e.key || (e.key && e.key.includes("inter_jee_app_data"))) {
        
        // Refresh AppAuth current user if they are logged in
        if (window.appAuth && window.appAuth.currentUser && window.appStore) {
           let freshUser = window.appStore.getUserById(window.appAuth.currentUser.id);
           if (!freshUser && window.appAuth.currentUser.username) {
             freshUser = window.appStore.getUserByUsername(window.appAuth.currentUser.username);
           }
           if (freshUser) {
             window.appAuth.currentUser = freshUser;
             localStorage.setItem("active_user", JSON.stringify(freshUser));
             localStorage.setItem(window.appAuth.SESSION_KEY, JSON.stringify(freshUser));
           }
        }

        const user = window.appAuth ? window.appAuth.getCurrentUser() : null;
        if (user && window.UI) {
          const chatContainer = document.getElementById("chat-messages-container");
          if (chatContainer) {
            // Append any new messages smoothly without tearing down the DOM and losing keyboard focus
            const activeChannel = window.UI.activeChatChannel || "general_announcements";
            const msgs = window.appStore.getChatMessages(activeChannel, user.id);
            if (!window.UI._chatRenderedIds) {
              window.UI._chatRenderedIds = new Set();
              chatContainer.querySelectorAll('[data-msg-id]').forEach(el => {
                const id = el.getAttribute('data-msg-id');
                if (id) window.UI._chatRenderedIds.add(id);
              });
            }
            for (let i = 0; i < msgs.length; i++) {
              const m = msgs[i];
              if (!window.UI._chatRenderedIds.has(m.id)) {
                window.UI.appendSingleChatMessage(m, user);
              }
            }
          }
        }
      }
    });
  }

  handleRoute() {
    const hash = window.location.hash || "#login";
    const appRoot = document.getElementById("app-root");
    if (!appRoot) return;

    if (typeof document !== 'undefined' && document.body) {
      document.body.classList.remove("chat-view-active");
      document.documentElement.classList.remove("chat-view-active");
    }

    const user = window.appAuth.getCurrentUser();

    // Unauthenticated Guard
    if (!user && hash !== "#login") {
      window.location.hash = "#login";
      appRoot.innerHTML = window.UI.renderLoginView();
      return;
    }

    // Role Guard: Redirect logged-in users to their dashboard if at #login or no hash
    if (user && (hash === "#login" || hash === "" || hash === "#")) {
      const targetRole = (user.role === 'admin' || user.role === 'chairman' || user.id === 'usr_admin') ? 'chairman' : (user.role || 'student');
      const targetHash = `#${targetRole}`;
      if (window.location.hash !== targetHash) {
        window.location.hash = targetHash;
      }
      if (targetRole === 'chairman') {
        user.role = 'chairman';
        appRoot.innerHTML = window.UI.renderChairmanDashboard();
      } else if (targetRole === 'teacher') {
        appRoot.innerHTML = window.UI.renderTeacherDashboard();
      } else if (['ceo', 'md', 'co-chairman', 'principal'].includes(targetRole)) {
        appRoot.innerHTML = window.UI.renderChairmanDashboard();
      } else {
        appRoot.innerHTML = window.UI.renderStudentDashboard();
      }
      return;
    }

    // Route Table
    switch (hash) {
      case "#chairman":
      case "#admin": // legacy fallback
        if (user.role !== "chairman" && user.role !== "admin" && user.id !== "usr_admin") {
          window.location.hash = `#${user.role}`;
          return;
        }
        user.role = "chairman";
        appRoot.innerHTML = window.UI.renderChairmanDashboard();
        break;

      case "#teacher":
        if (user.role !== "teacher") {
          window.location.hash = `#${user.role}`;
          return;
        }
        appRoot.innerHTML = window.UI.renderTeacherDashboard();
        break;

      case "#student":
        if (user.role !== "student") {
          window.location.hash = `#${user.role}`;
          return;
        }
        appRoot.innerHTML = window.UI.renderStudentDashboard();
        break;

      case "#ceo":
      case "#md":
      case "#co-chairman":
      case "#principal":
        // Chairman-assigned staff roles – route to Chairman dashboard view
        if (!['ceo','md','co-chairman','principal'].includes(user.role)) {
          window.location.hash = `#${user.role}`;
          return;
        }
        appRoot.innerHTML = window.UI.renderChairmanDashboard();
        break;

      case "#login":
      default:
        appRoot.innerHTML = window.UI.renderLoginView();
        break;
    }
  }

  toggleViewMode() {
    const container = document.getElementById("app-container");
    const btnText = document.getElementById("mode-btn-text");
    if (!container) return;

    if (container.classList.contains("mobile-mode")) {
      container.classList.remove("mobile-mode");
      btnText.innerText = "📱 Switch to Mobile View";
    } else {
      container.classList.add("mobile-mode");
      btnText.innerText = "💻 Switch to Desktop View";
    }
  }
}

window.app = new App();

  // Check if running as installed standalone app
  function isRunningStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || 
           window.navigator.standalone === true || 
           document.referrer.includes('android-app://');
  }

  // Native Android PWA / APK Install Prompt Handler
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const installBtn = document.getElementById('pwa-install-btn');
    if (installBtn && !isRunningStandalone()) installBtn.style.display = 'inline-flex';
  });

  // Hide install button immediately if running in installed standalone app
  if (isRunningStandalone()) {
    const installBtn = document.getElementById('pwa-install-btn');
    if (installBtn) installBtn.style.display = 'none';
  }

  window.installAndroidApp = async function() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') {
        const installBtn = document.getElementById('pwa-install-btn');
        if (installBtn) installBtn.style.display = 'none';
        if (window.UI && window.UI.showToast) window.UI.showToast('Installing Loom App to Home screen...', 'success');
      }
      deferredInstallPrompt = null;
    } else {
      if (window.UI && window.UI.showInstallModal) {
        window.UI.showInstallModal();
      } else {
        const link = document.createElement('a');
        link.href = '/Loom.apk';
        link.download = 'Loom.apk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }
  };

  // Service Worker registration & cache update
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      for (let reg of regs) {
        reg.update();
      }
    });
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }

  // Start cloud sync polling after app loads
  if (typeof CloudSync !== 'undefined') {
    CloudSync.pull().then(() => {
      if (window.app) window.app.handleRoute();
    });
    CloudSync.startPolling();
  }
  </script>
</body>
